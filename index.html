<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <!--
      Content Security Policy: everything this page needs (script, styles, images, sound) is
      served from its own origin, and no inline scripts or event handlers are used.
    -->
    <meta content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
          http-equiv="Content-Security-Policy">

    <title>Muhammad Owais Mushtaq | Senior Software Engineer & Tech Lead</title>
    <meta content="Chat with Owais's virtual assistant: ask about his work in wealth-management FinTech, skills, projects, education and how to get in touch."
          name="description">

    <!-- Open Graph / link previews (WhatsApp, LinkedIn, X) -->
    <meta content="Owais' Portfolio" property="og:site_name">
    <meta content="Muhammad Owais Mushtaq | Senior Software Engineer & Tech Lead" property="og:title">
    <meta content="A WhatsApp-style chat with Owais's virtual assistant: projects, skills, education and contact details."
          property="og:description">
    <meta content="https://muhammadowaismushtaq.github.io/portfolio-whatsapp/images/dp.jpg" property="og:image">
    <meta content="image/jpeg" property="og:image:type">
    <meta content="website" property="og:type">
    <meta content="https://muhammadowaismushtaq.github.io/portfolio-whatsapp/" property="og:url">

    <link href="images/dp.jpg" rel="icon" type="image/jpeg">
    <link href="style.css" rel="stylesheet">
    <!-- defer: runs after the HTML is parsed, so every element the script needs exists. -->
    <script defer src="script.js"></script>
</head>

<body>

<div class="chat-app">
    <header class="chat-header">
        <button aria-label="View profile picture" class="profile-photo-button" data-open-photo type="button">
            <img alt="Muhammad Owais Mushtaq" class="profile-photo" height="40" src="images/dp.jpg" width="40">
        </button>
        <div class="contact-info">
            <span class="contact-name">
                Muhammad Owais Mushtaq
                <svg aria-label="Business account" class="business-badge" role="img" viewBox="0 0 24 24">
                    <path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Zm-1.5 16-4-4 1.4-1.4 2.6 2.6 6.1-6.1L18 9.5 10.5 17Z"
                          fill="currentColor"/>
                </svg>
            </span>
            <span aria-live="polite" class="contact-status" data-contact-status>online</span>
        </div>
    </header>

    <main class="chat-body" data-chat-body>
        <p class="system-notice">
            🤖 This chat is answered by Owais's automated assistant. Messages you type here are not sent to
            Owais. To reach him directly, type <strong>contact</strong>.
        </p>
        <ul aria-live="polite" class="message-list" data-message-list></ul>
    </main>

    <div class="quick-replies" data-quick-replies></div>

    <footer class="chat-footer">
        <form autocomplete="off" class="send-bar" data-send-form>
            <label class="visually-hidden" for="messageInput">Type a message</label>
            <input enterkeyhint="send" id="messageInput" maxlength="300" placeholder="Type a message" type="text">
            <button aria-label="Send message" class="send-button" type="submit">
                <svg aria-hidden="true" height="24" viewBox="0 0 24 24" width="24">
                    <path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"
                          fill="currentColor"></path>
                </svg>
            </button>
        </form>
    </footer>
</div>

<div aria-label="Profile picture" aria-modal="true" class="photo-viewer" data-photo-viewer hidden role="dialog">
    <button aria-label="Close profile picture" class="photo-viewer-close" data-close-photo type="button">&times;</button>
    <img alt="Muhammad Owais Mushtaq" class="photo-viewer-image" src="images/dp.jpg">
</div>

</body>
</html>
